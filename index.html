<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta
      name="description"
      content="A closer look at Sri Lanka. Explore roads, landscapes, buildings and places with Mazo Maps."
    />
    <meta
      property="og:title"
      content="Mazo Maps — A closer look at Sri Lanka"
    />
    <meta
      property="og:description"
      content="An open map of the whole island, from the coast to the hill country."
    />
    <title>Mazo Maps — A closer look at Sri Lanka</title>
    <link rel="icon" type="image/svg+xml" href="./assets/mazo-mark.svg" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="modulepreload" href="./assets/vendor/maplibre-gl.mjs" />
    <link rel="modulepreload" href="./assets/vendor/pmtiles.mjs" />
    <script>
      try {
        const t = localStorage.getItem('mazo-maps-theme');
        document.documentElement.dataset.theme =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
      } catch {}
    </script>
    <link rel="stylesheet" href="./assets/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="./assets/css/site.css" />
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#map">Skip to map</a>
    <main id="main">
      <div class="map-frame" id="map-frame" data-state="loading">
        <div id="map" role="region" aria-label="Interactive map of Sri Lanka" tabindex="0"></div>
        <div class="search-dock">
          <form id="search-form" class="search-box" role="search">
            <a class="brand" href="./" aria-label="Mazo Maps home"><img src="./assets/mazo-mark.svg" width="32" height="32" alt=""/><strong>Mazo Maps</strong></a>
            <label class="sr-only" for="map-search">Search Sri Lanka</label>
            <input id="map-search" type="search" placeholder="Search Sri Lanka" autocomplete="off" aria-controls="search-results" />
            <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
          </form>
          <div id="search-results" class="panel search-results" aria-label="Search results" hidden></div>
          <div class="categories" role="group" aria-label="Place categories">
            <button data-category="all" aria-pressed="true">Explore</button>
            <button data-category="food" aria-pressed="false">Food</button>
            <button data-category="hotel" aria-pressed="false">Hotels</button>
            <button data-category="park" aria-pressed="false">Nature</button>
            <button data-category="health" aria-pressed="false">Health</button>
            <button data-category="shop" aria-pressed="false">Shopping</button>
          </div>
        </div>
        <div class="utility-controls" aria-label="Map tools">
          <button class="icon-button" id="directions-toggle" aria-label="Directions" aria-expanded="false" aria-controls="directions-panel" title="Directions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 10 10-10 10L2 12ZM8 16v-5h8m-3-3 3 3-3 3"/></svg></button>
          <button class="icon-button" id="layers-toggle" aria-label="Map layers" aria-expanded="false" aria-controls="layers-panel" title="Layers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 8 10-5 10 5-10 5ZM2 12l10 5 10-5M2 16l10 5 10-5"/></svg></button>
          <button class="icon-button" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false" title="Light or dark map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></svg></button>
        </div>
        <section class="panel tool-panel" id="layers-panel" aria-label="Map layers" hidden>
          <h2>Map layers</h2>
          <label><input type="checkbox" data-layer="roads" checked/> Roads</label>
          <label><input type="checkbox" data-layer="buildings" checked/> Buildings</label>
          <label><input type="checkbox" data-layer="places" checked/> Places</label>
          <label><input type="checkbox" data-layer="landmarks" checked/> Cities & destinations</label>
          <label for="city-select">Quick city view</label>
          <select id="city-select" aria-label="Choose a place"><option value="island">Sri Lanka · All island</option><option value="colombo">Colombo</option><option value="jaffna">Jaffna</option><option value="kandy">Kandy</option><option value="galle">Galle</option><option value="trincomalee">Trincomalee</option><option value="batticaloa">Batticaloa</option></select>
          <button id="map-fullscreen" aria-label="Enter fullscreen" aria-pressed="false">Fullscreen</button>
        </section>
        <section class="panel tool-panel" id="directions-panel" aria-label="Directions" hidden>
          <h2>Directions</h2>
          <form id="directions-form">
            <label for="route-from">From</label><input id="route-from" list="destinations" required placeholder="City or destination"/>
            <label for="route-to">To</label><input id="route-to" list="destinations" required placeholder="City or destination"/>
            <datalist id="destinations"></datalist>
            <button type="submit">Find a route</button>
            <p id="route-status" role="status">Routes open on OpenStreetMap in a new tab.</p>
            <a id="route-link" target="_blank" rel="noopener noreferrer" hidden>Open directions ↗</a>
          </form>
        </section>
        <div class="map-loading" id="map-status" role="status" aria-live="polite"><span class="loading-pulse" aria-hidden="true"></span><span>Loading Sri Lanka</span></div>
        <div class="map-actions">
          <button class="icon-button" id="map-locate" aria-label="Find my location" title="My location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
          <button class="icon-button" id="map-reset" aria-label="Reset map view to Sri Lanka" title="Island view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg></button>
        </div>
        <a class="attribution-link" href="./ATTRIBUTION.md" target="_blank" rel="noopener">Mazo Maps · Sources</a>
      </div>
    </main>
  </body>
</html>
