name: Verify deployed Sri Lanka map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test package
        run: |
          npm install --prefix "$RUNNER_TEMP/mazo-playwright" --no-save --no-package-lock playwright@1.55.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/mazo-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Confirm runner Chrome
        run: google-chrome --version
      - name: Verify live archive ranges and rendered map
        run: node scripts/verify-live-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mazo-sri-lanka-live-verification
          path: |
            mazo-sri-lanka-*.png
            verification/map-smoke*.json
          if-no-files-found: warn
          retention-days: 14
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve pinned boundary evidence
        run: |
          mkdir -p boundaries
          for level in ADM1 ADM2 ADM3; do
            for suffix in -metaData.json .geojson; do
              file="geoBoundaries-LKA-$level$suffix"
              curl --fail --location --retry 3 "https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/5c25134028196d43ce97b5071934fd0cfc92f09f/releaseData/gbOpen/LKA/$level/$file" -o "boundaries/$file"
            done
          done
          sha256sum boundaries/*
          curl --fail --location 'https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/5c25134028196d43ce97b5071934fd0cfc92f09f/sourceData/gbOpen/LKA_ADM3.zip' -o boundaries/source.zip
          python3 - <<'PYCODE'
          import json, zipfile
          from pathlib import Path
          z = zipfile.ZipFile('boundaries/source.zip')
          print('::notice title=source-files::' + json.dumps(z.namelist()))
          for name in z.namelist():
              if name.endswith('.geojson'):
                  j = json.loads(z.read(name))
                  print('::notice title=source-fields::' + json.dumps(j['features'][0]['properties']))
              if name.endswith('.txt'):
                  print('::notice title=source-metadata::' + z.read(name).decode().replace('\n', '%0A'))
          for path in Path('boundaries').glob('*metaData.json'):
              print('::notice title=' + path.name + '::' + json.dumps(json.loads(path.read_text())))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: sri-lanka-boundary-evidence
          path: boundaries/
          retention-days: 7
