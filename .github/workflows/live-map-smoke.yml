name: Verify deployed Sri Lanka map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test package
        run: |
          npm install --prefix "$RUNNER_TEMP/mazo-playwright" --no-save --no-package-lock playwright@1.55.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/mazo-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Confirm runner Chrome
        run: google-chrome --version
      - name: Verify live archive ranges and rendered map
        run: node scripts/verify-live-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mazo-sri-lanka-live-verification
          path: |
            mazo-sri-lanka-*.png
            verification/map-smoke*.json
          if-no-files-found: warn
          retention-days: 14
  boundaries:
    if: github.ref == 'refs/heads/feat/geographic-contributions'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin Survey Department boundary source
        run: |
          mkdir -p data/boundaries/source
          curl --fail --location --retry 3 'https://data.humdata.org/dataset/0bedcaf3-88cd-4591-b9d5-5d3220e26abf/resource/ac173fa4-dd42-4be4-aaed-a2e445525865/download/lka_admin_boundaries.geojson.zip' -o data/boundaries/source/lka-2026-01-26.geojson.zip
          curl --fail --location 'https://data.humdata.org/api/3/action/package_show?id=cod-ab-lka' -o data/boundaries/source/hdx-metadata.json
          python3 - <<'PYCODE'
          import hashlib, json, zipfile
          from pathlib import Path
          p = Path('data/boundaries/source/lka-2026-01-26.geojson.zip')
          print('::notice title=boundary-checksum::' + hashlib.sha256(p.read_bytes()).hexdigest())
          z = zipfile.ZipFile(p)
          print('::notice title=boundary-files::' + json.dumps(z.namelist()))
          for n in z.namelist():
              if n.endswith('.geojson'):
                  j = json.loads(z.read(n))
                  print('::notice title=boundary-fields::' + json.dumps([n, len(j['features']), j['features'][0]['properties']]))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boundaries/source
          git diff --cached --quiet || git commit -m 'Pin Sri Lanka boundaries'
          git push origin HEAD:feat/geographic-contributions
