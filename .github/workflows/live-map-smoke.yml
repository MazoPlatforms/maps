name: Verify deployed Sri Lanka map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test package
        run: |
          npm install --prefix "$RUNNER_TEMP/mazo-playwright" --no-save --no-package-lock playwright@1.55.0
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/mazo-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Confirm runner Chrome
        run: google-chrome --version
      - name: Verify live archive ranges and rendered map
        run: node scripts/verify-live-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mazo-sri-lanka-live-verification
          path: |
            mazo-sri-lanka-*.png
            verification/map-smoke*.json
          if-no-files-found: warn
          retention-days: 14
  boundaries:
    if: github.ref == 'refs/heads/feat/geographic-contributions'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import pinned Survey Department boundaries
        run: |
          pip install -r requirements-geodata.txt
          curl --fail --location --retry 3 'https://data.humdata.org/dataset/0bedcaf3-88cd-4591-b9d5-5d3220e26abf/resource/ac173fa4-dd42-4be4-aaed-a2e445525865/download/lka_admin_boundaries.geojson.zip' -o "$RUNNER_TEMP/lka-boundaries.zip"
          python scripts/import-boundaries.py "$RUNNER_TEMP/lka-boundaries.zip" --output data/boundaries/sri-lanka
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boundaries/sri-lanka
          git diff --cached --quiet || git commit -m 'Pin Sri Lanka boundaries'
          git push origin HEAD:feat/geographic-contributions 2> "$RUNNER_TEMP/push-error"
      - name: Report import failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/push-error"; then
            while IFS= read -r line; do echo "::notice title=push::$line"; done < "$RUNNER_TEMP/push-error"
          fi
