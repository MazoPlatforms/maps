name: Build and publish Sri Lanka basemap

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'docs/**'
      - 'sdk/**'
      - 'schemas/**'
      - 'data/boundaries/**'
      - 'data/canonical/**'
      - 'data/overture/**'
      - 'data/sri-lanka/**'
      - 'contributions/**'
      - 'scripts/assemble-canonical.py'
      - 'scripts/build-dataset.py'
      - 'scripts/build-overture-theme.sh'
      - 'scripts/canonical.py'
      - 'scripts/contributions.py'
      - 'scripts/fetch-upstream.py'
      - 'scripts/finalize-styles.py'
      - 'scripts/geodata/**'
      - 'scripts/refresh_offline_manifest.py'
      - 'scripts/reuse-basemap.py'
      - 'scripts/validate-tiles.py'
      - 'scripts/verify_canonical_site.py'
      - 'scripts/verify-live-map.mjs'
      - 'scripts/verify-source-identities.mjs'
      - 'service-worker.js'
      - 'LICENSE'
      - 'LICENSE-DATA.md'
      - 'ATTRIBUTION.md'
      - 'README.md'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      refresh_basemap:
        type: boolean
        default: false
        description: Refresh nationwide Overture archives

permissions:
  contents: read

concurrency:
  group: mazo-maps-pages
  cancel-in-progress: true

env:
  BBOX: 79.3,5.8,82.1,10.1
  OVERTURE_TILE_IMAGE: ghcr.io/overturemaps/overture-tiles@sha256:b1cf28ea7903497020f0677ec514b1f4d1f7a8bcfa748163dd445c2bc842ddf5

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-geodata.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    outputs:
      deploy_allowed: ${{ steps.size.outputs.deploy_allowed }}
      site_bytes: ${{ steps.size.outputs.site_bytes }}
      release: ${{ steps.publication.outputs.release }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-geodata.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select basemap build
        id: mode
        env:
          BEFORE: ${{ github.event.before }}
          REFRESH: ${{ inputs.refresh_basemap }}
        run: |
          rebuild=false
          if [[ "$REFRESH" == true ]]; then rebuild=true; fi
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            if git diff --name-only "$BEFORE" HEAD | rg '^data/overture/'; then rebuild=true; fi
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
      - name: Reuse verified nationwide archives
        if: steps.mode.outputs.rebuild != 'true'
        run: python scripts/reuse-basemap.py --output data/sri-lanka

      - name: Resolve latest official Overture release
        if: steps.mode.outputs.rebuild == 'true'
        id: release
        run: |
          release="$(curl --fail --silent --show-error --location https://stac.overturemaps.org/catalog.json | jq --raw-output '.latest')"
          [[ "$release" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]] || { echo "Unexpected Overture release identifier" >&2; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Building official Overture release $release for $BBOX"

      - name: Pull official Overture tile builder
        if: steps.mode.outputs.rebuild == 'true'
        run: |
          docker pull "$OVERTURE_TILE_IMAGE"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$OVERTURE_TILE_IMAGE")"
          echo "Official builder image: $digest"
          echo "OVERTURE_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Set up PMTiles verifier
        if: steps.mode.outputs.rebuild == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build four Sri Lanka PMTiles archives
        if: steps.mode.outputs.rebuild == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          mkdir -p data/sri-lanka counts
          for theme in base transportation buildings places; do
            : > "counts/$theme.tsv"
            docker run --rm \
              --mount "type=bind,source=$GITHUB_WORKSPACE/data/sri-lanka,target=/data" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/counts,target=/counts" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/build-overture-theme.sh,target=/build-theme.sh,readonly" \
              --env RELEASE --env THEME="$theme" --env BBOX --env SKIP_UPLOAD=true \
              --env OUTPUT=unused \
              --entrypoint /bin/bash "$OVERTURE_TILE_IMAGE" /build-theme.sh
          done
          sudo chown -R "$(id -u):$(id -g)" data/sri-lanka counts

      - name: Install PMTiles verifier
        if: steps.mode.outputs.rebuild == 'true'
        run: |
          go install github.com/protomaps/go-pmtiles@v1.31.2
          ln -sf go-pmtiles "$(go env GOPATH)/bin/pmtiles"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify archives and record provenance
        if: steps.mode.outputs.rebuild == 'true'
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          python3 scripts/validate-tiles.py \
            --data-dir data/sri-lanka --counts-dir counts \
            --release "$RELEASE" --image-digest "$OVERTURE_IMAGE_DIGEST" \
            --bbox "$BBOX" --manifest data/sri-lanka/manifest.json
          node scripts/verify-source-identities.mjs data/sri-lanka
          cat data/sri-lanka/manifest.json

      - name: Build contribution layers
        id: publication
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          release="$(jq -r .release data/sri-lanka/manifest.json)"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          python scripts/fetch-upstream.py --records data/sri-lanka --release "$release" --output "$RUNNER_TEMP/upstream.json"
          options=()
          if [[ -n "$BASE_REF" && "$BASE_REF" != 0000000000000000000000000000000000000000 ]]; then options=(--base-ref "$BASE_REF"); fi
          python scripts/contributions.py build --basemap data/sri-lanka/manifest.json --upstream "$RUNNER_TEMP/upstream.json" --output "$RUNNER_TEMP/contributions" "${options[@]}"

      - name: Build canonical regional API, tiles, and offline package
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          test "$(git -C "$RUNNER_TEMP/tippecanoe" rev-parse HEAD)" = 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C "$RUNNER_TEMP/tippecanoe" -j2 tippecanoe tippecanoe-decode
          TIPPECANOE_MAX_THREADS=2 python scripts/build-dataset.py --snapshot data/canonical --output "$RUNNER_TEMP/canonical-build" --tippecanoe "$RUNNER_TEMP/tippecanoe/tippecanoe"
          python scripts/assemble-canonical.py --build "$RUNNER_TEMP/canonical-build" --output "$RUNNER_TEMP/canonical-site"
          python scripts/verify_canonical_site.py --site "$RUNNER_TEMP/canonical-site"

      - name: Assemble site and enforce Pages size limit
        id: size
        run: |
          mkdir -p _site
          cp index.html .nojekyll LICENSE ATTRIBUTION.md LICENSE-DATA.md README.md service-worker.js _site/
          cp -r assets docs schemas sdk _site/
          mkdir -p _site/data/sri-lanka
          cp data/sri-lanka/*.pmtiles data/sri-lanka/manifest.json _site/data/sri-lanka/
          cp -r "$RUNNER_TEMP/contributions" _site/data/contributions
          python3 scripts/finalize-styles.py _site
          cp -a "$RUNNER_TEMP/canonical-site/api" _site/
          cp -a "$RUNNER_TEMP/canonical-site/data/mazo" _site/data/
          mkdir -p _site/data/canonical
          cp -a "$RUNNER_TEMP/canonical-site/data/canonical/licenses" _site/data/canonical/
          cp "$RUNNER_TEMP/canonical-site/offline-manifest.json" _site/offline-manifest.json
          python scripts/refresh_offline_manifest.py --site _site
          python scripts/verify_canonical_site.py --site _site
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_site/api/v1/manifest.json').read_text())
          if manifest.get('complete') is not False or manifest.get('records', 0) > 20000:
              raise SystemExit('Canonical Pages output must remain explicitly bounded and incomplete')
          if not Path('_site/data/mazo/offline-light.json').is_file():
              raise SystemExit('Canonical offline style was not assembled')
          print(f"Publishing labeled canonical sample: {manifest['records']} records; complete={manifest['complete']}")
          PY
          site_bytes="$(du -sb _site | cut -f1)"
          if (( site_bytes <= 990000000 )); then deploy_allowed=true; else deploy_allowed=false; fi
          echo "site_bytes=$site_bytes" >> "$GITHUB_OUTPUT"
          echo "deploy_allowed=$deploy_allowed" >> "$GITHUB_OUTPUT"
          echo "Site payload: $site_bytes bytes; Pages deploy permitted: $deploy_allowed"
          if [[ "$deploy_allowed" != true ]]; then
            echo "Built data exceeds the safe GitHub Pages payload limit; retain it as an Actions artifact instead." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducible site build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazo-maps-sri-lanka-${{ steps.publication.outputs.release }}
          path: _site/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Summarize tile build
        run: |
          python3 - <<'PY'
          import json, os
          path = '_site/data/sri-lanka/manifest.json'
          manifest = json.load(open(path))
          total = sum(item['bytes'] for item in manifest['archives'].values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"## Sri Lanka tile build\n\n- Overture release: `{manifest['release']}`\n- Bbox: `{manifest['bbox']}`\n- Archive bytes: **{total:,}**\n- Site bytes: **${{ steps.size.outputs.site_bytes }}**\n- Source counts are bbox-filtered Parquet rows, not rendered-tile totals.\n- Attribution: {manifest['attribution']}\n")
              canonical = json.load(open('_site/api/v1/manifest.json'))
              out.write(f"\n## Independent Mazo canonical dataset\n\n- Records: **{canonical['records']:,}**\n- Complete nationwide coverage: **{canonical['complete']}**\n- Coverage: {canonical['coverage']['coverage']}\n- Published at `/api/v1/` and `/data/mazo/`; the legacy national viewer at `/` remains unchanged.\n")
          PY

  deploy:
    needs: build
    if: needs.build.outputs.deploy_allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: mazo-maps-sri-lanka-${{ needs.build.outputs.release }}
          path: _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: [build, deploy]
    if: needs.build.outputs.deploy_allowed == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verifier in runner temp
        run: |
          npm install --prefix "$RUNNER_TEMP/mazo-playwright" --no-save playwright@1.55.0
          google-chrome --version
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/mazo-playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify deployed archive ranges and map rendering
        run: node scripts/verify-live-map.mjs
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mazo-maps-live-verification
          path: |
            mazo-sri-lanka-*.png
            verification/map-smoke.json
          if-no-files-found: warn
          retention-days: 7
