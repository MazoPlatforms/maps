name: Validate geographic contributions

on:
  pull_request:
  push:
    branches: [main, feat/geographic-contributions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-geodata.txt
      - name: Build pinned pilot tile compiler
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          test "$(git -C "$RUNNER_TEMP/tippecanoe" rev-parse HEAD)" = 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C "$RUNNER_TEMP/tippecanoe" -j2 tippecanoe tippecanoe-decode
      - name: Verify canonical records and real offline PMTiles output
        run: |
          TIPPECANOE="$RUNNER_TEMP/tippecanoe/tippecanoe" python -m unittest discover -s tests -p 'test_canonical.py' -v
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-geodata.txt
      - run: pip install -r requirements-geodata.txt
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/verify-upstream.py
      - name: Validate current upstream and record history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl --fail --location --retry 3 https://mazoplatforms.github.io/maps/data/sri-lanka/manifest.json -o "$RUNNER_TEMP/basemap.json"
          release="$(jq -r .release "$RUNNER_TEMP/basemap.json")"
          python scripts/fetch-upstream.py --records data/sri-lanka --release "$release" --output "$RUNNER_TEMP/upstream.json"
          options=()
          if [[ -n "$BASE_REF" && "$BASE_REF" != 0000000000000000000000000000000000000000 ]]; then options=(--base-ref "$BASE_REF"); fi
          python scripts/contributions.py validate --basemap "$RUNNER_TEMP/basemap.json" --upstream "$RUNNER_TEMP/upstream.json" "${options[@]}"
          python scripts/contributions.py build --basemap "$RUNNER_TEMP/basemap.json" --upstream "$RUNNER_TEMP/upstream.json" --output "$RUNNER_TEMP/contributions-first"
          python scripts/contributions.py build --basemap "$RUNNER_TEMP/basemap.json" --upstream "$RUNNER_TEMP/upstream.json" --output "$RUNNER_TEMP/contributions-second"
          diff -r "$RUNNER_TEMP/contributions-first" "$RUNNER_TEMP/contributions-second"
      - name: Verify browser contributions
        run: |
          npm install --prefix "$RUNNER_TEMP/mazo-playwright" --no-save --no-package-lock playwright@1.55.0
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mazo-playwright/node_modules/playwright/index.mjs" node scripts/verify-contributions.mjs
