name: Canonical changesets and independent regional build
on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [feat/geographic-contributions, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      boundary: ${{ steps.review-summary.outputs.boundary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: pip install -r requirements-geodata.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - run: node --test tests/*.test.mjs
      - name: Preserve committed canonical feature history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != 0000000000000000000000000000000000000000 ]]; then
            python scripts/verify-snapshot-history.py --base-ref "$BASE_REF" --report "$RUNNER_TEMP/snapshot-review.json"
          fi
      - name: Validate complete canonical data and transactional proposals
        run: python scripts/validate-changesets.py --output "$RUNNER_TEMP/review"
      - name: Compile pinned regional tile tool
        run: |
          git clone --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          test "$(git -C "$RUNNER_TEMP/tippecanoe" rev-parse HEAD)" = 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C "$RUNNER_TEMP/tippecanoe" -j2 tippecanoe tippecanoe-decode
      - name: Build independent API and tiles from the reviewed proposed snapshot
        run: |
          TIPPECANOE="$RUNNER_TEMP/tippecanoe/tippecanoe" python -m unittest discover -s tests -p 'test_canonical.py' -q
          TIPPECANOE_MAX_THREADS=2 python scripts/build-dataset.py --snapshot "$RUNNER_TEMP/review/snapshot" --output "$RUNNER_TEMP/canonical-build" --tippecanoe "$RUNNER_TEMP/tippecanoe/tippecanoe"
          python scripts/assemble-canonical.py --build "$RUNNER_TEMP/canonical-build" --output "$RUNNER_TEMP/canonical-site"
          MAZO_API_BUILD="$RUNNER_TEMP/canonical-build" node --test tests/sdk-real.test.mjs
      - name: Verify real browser editor, offline recovery and routing
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mazo-browser" --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.14.0
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/mazo-browser/node_modules/playwright/index.mjs" AXE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mazo-browser/node_modules/@axe-core/playwright/dist/index.mjs" CHROMIUM_PATH="$(command -v google-chrome)" node scripts/verify-platform.mjs "$RUNNER_TEMP/canonical-site" | tee "$RUNNER_TEMP/review/browser.json"
      - name: Record elevated boundary review requirement
        id: review-summary
        run: |
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          review=json.loads((root/'review/review.json').read_text())
          snapshot=root/'snapshot-review.json'
          boundary=review['boundaryReview'] or (json.loads(snapshot.read_text())['boundaryReview'] if snapshot.exists() else True)
          print('boundary='+str(boundary).lower())
          PYCODE
          cat "$RUNNER_TEMP/review/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if python -c 'import json,sys;sys.exit(not json.load(open(sys.argv[1]))["boundaryReview"])' "$RUNNER_TEMP/review/review.json"; then
            echo 'Boundary changes require two configured maintainer approvals; deployment remains blocked until repository protection is verified.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-review-and-site
          path: |
            ${{ runner.temp }}/review
            ${{ runner.temp }}/canonical-site
          retention-days: 7

  maintainer-review:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    needs: validate-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check exact-head approval using trusted base policy and script
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          BOUNDARY: ${{ needs.validate-and-build.outputs.boundary }}
        run: |
          git show "$BASE_REF:scripts/check-review.py" > "$RUNNER_TEMP/check-review.py"
          flags=()
          if [[ "$BOUNDARY" == true ]]; then flags=(--boundary); fi
          python "$RUNNER_TEMP/check-review.py" --repository "$REPOSITORY" --number "$NUMBER" --base-ref "$BASE_REF" "${flags[@]}"
